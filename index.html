<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ehramın sirləri</title>
<style>
:root{--bg:#e9e2d0;--ink:#2a2418;--btn:#d4c7a5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--ink:#eadfc2;--btn:#322b1f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17140f;--ink:#eadfc2;--btn:#322b1f;color-scheme:dark}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px}
canvas{width:min(100%,calc(100svh - 80px));height:auto;aspect-ratio:1/1;border-radius:8px;touch-action:none;display:block;background:#000}
#pad{display:none;gap:18px;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
#pad .dp{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,54px);gap:6px}
#pad .ac{display:flex;gap:10px}
#pad .ac button{width:84px;height:100px;font-size:15px;font-weight:700}
#pad .atk{background:#b8442e!important;color:#fff!important}
#pad button,#mt{border:0;border-radius:12px;background:var(--btn);color:var(--ink);font:700 20px system-ui,sans-serif;touch-action:none}
#pad button:active{filter:brightness(.75)}
#mt{padding:6px 14px;font-size:13px;font-weight:600;touch-action:auto}
p.h{margin:0;font-size:13px;max-width:560px;text-align:center;opacity:.8;line-height:1.5}
@media (pointer:coarse){#pad{display:flex}p.h{display:none}canvas{width:min(100%,calc(100svh - 230px))}}
button:focus-visible{outline:3px solid #e0a030;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c" width="640" height="640" aria-label="Ehram labirinti oyunu"></canvas>
<button id="mt" type="button">Səs: açıq</button>
<div id="pad">
 <div class="dp">
  <span></span><button data-k="ArrowUp" aria-label="Yuxarı">▲</button><span></span>
  <button data-k="ArrowLeft" aria-label="Sol">◀</button><button data-k="ArrowDown" aria-label="Aşağı">▼</button><button data-k="ArrowRight" aria-label="Sağ">▶</button>
 </div>
 <div class="ac"><button data-a="sw">Silah</button><button class="atk" data-k=" ">Hücum</button></div>
</div>

<p class="h">Oxlar/WASD: hərəkət. Boşluq: hücum. Q/E və ya 1–4: silah dəyiş. Düşmənləri öldür, qızıl və silah topla. Xəzinə sandıqlarını tap. Ankhları tapıb çıxışa çat. P: fasilə. M: səs.</p>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),VW=640,VH=640,TS=40,PI=Math.PI,R=Math.random;
const DK=document.createElement('canvas');DK.width=VW;DK.height=VH;const dg=DK.getContext('2d');
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
let T,GR,EXP,MAPC,PD,EX,EY,ANK,GEM,OIL,SPK,ENE=[],ITM=[],PRJ=[],CHE=[],FX=[],TOR;
let G=freshG(),P={x:60,y:60,tx:1,ty:1,ang:0,walk:0};
let state='menu',keys={},best=0,last=0,muted=false,AC=null,shake=0,flash=0,msgT=0,msgTxt='',lastGroan=0;
try{best=+sessionStorage.getItem('ebest')||0}catch(e){}
/* ---- səs ---- */
function initAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return}
 try{
  AC=new(window.AudioContext||window.webkitAudioContext)();
  for(const f of [55,82.5]){const o=AC.createOscillator(),q=AC.createGain();o.type='sine';o.frequency.value=f;q.gain.value=.025;o.connect(q);q.connect(AC.destination);o.start()}
 }catch(e){AC=null}
}
function snd(n){
 if(muted||!AC)return;
 const T_=(f0,f1,d,ty,v,dl)=>{const t=AC.currentTime+(dl||0),o=AC.createOscillator(),q=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);q.gain.setValueAtTime(v,t);q.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(q);q.connect(AC.destination);o.start(t);o.stop(t+d+.02)};
 if(n==='ankh')[660,880,1320].forEach((f,i)=>T_(f,f,.18,'sine',.1,i*.08));
 else if(n==='gem')T_(900,1400,.12,'triangle',.08);
 else if(n==='oil')T_(300,500,.2,'sine',.1);
 else if(n==='hurt'){T_(220,60,.4,'sawtooth',.14);T_(90,40,.5,'square',.08)}
 else if(n==='groan'){const t=AC.currentTime;if(t-lastGroan>3){lastGroan=t;T_(110,55,.8,'sawtooth',.07)}}
 else if(n==='locked')T_(200,150,.2,'square',.07);
 else if(n==='open'){T_(200,900,.6,'sawtooth',.06);T_(100,400,.6,'square',.05)}
 else if(n==='door')[392,523,659,784].forEach((f,i)=>T_(f,f,.2,'triangle',.1,i*.1));
 else if(n==='win')[523,659,784,1047,1319,1568].forEach((f,i)=>T_(f,f,.3,'triangle',.1,i*.14));
 else if(n==='over')T_(300,40,1.2,'sawtooth',.14);
 else if(n==='hiss')T_(2400,900,.4,'sawtooth',.03);
 else if(n==='swing')T_(500,200,.12,'sawtooth',.05);
 else if(n==='hit')T_(180,70,.12,'square',.09);
 else if(n==='kill'){T_(320,70,.35,'sawtooth',.1);T_(160,50,.3,'square',.06)}
 else if(n==='coin')T_(1200,1750,.08,'square',.045);
 else if(n==='pick')[700,990].forEach((f,i)=>T_(f,f,.12,'triangle',.1,i*.07));
 else if(n==='chest')[440,554,659,880].forEach((f,i)=>T_(f,f,.16,'triangle',.11,i*.09));
 else if(n==='sw')T_(600,800,.05,'square',.04);
 else if(n==='efire')T_(400,200,.15,'sawtooth',.05);
 else if(n==='shotb')T_(700,300,.08,'triangle',.07);
 else if(n==='shotf')T_(300,120,.25,'sawtooth',.08);
 else if(n==='shote')T_(900,400,.3,'square',.07);
 else if(n==='shield')T_(1200,1800,.14,'sine',.1);
}
function toggleMute(){muted=!muted;document.getElementById('mt').textContent='Səs: '+(muted?'bağlı':'açıq')}
/* ---- labirint ---- */
function genMaze(n){
 T=2*n+1;GR=new Uint8Array(T*T).fill(1);
 const st=[[0,0]],seen=new Uint8Array(n*n);seen[0]=1;GR[T+1]=0;
 while(st.length){
  const [cx,cy]=st[st.length-1],nb=[];
  for(const [dx,dy] of D4){const nx=cx+dx,ny=cy+dy;if(nx>=0&&ny>=0&&nx<n&&ny<n&&!seen[ny*n+nx])nb.push([nx,ny,dx,dy])}
  if(!nb.length){st.pop();continue}
  const [nx,ny,dx,dy]=nb[R()*nb.length|0];seen[ny*n+nx]=1;
  GR[(2*cy+1+dy)*T+2*cx+1+dx]=0;GR[(2*ny+1)*T+2*nx+1]=0;st.push([nx,ny]);
 }
 for(let i=0;i<n*n*.12;i++){const x=1+(R()*(T-2)|0),y=1+(R()*(T-2)|0);if((x+y)%2===1&&GR[y*T+x]===1)GR[y*T+x]=0}
}
function bfs(sx,sy){
 const d=new Int16Array(T*T).fill(-1),q=[sy*T+sx];d[q[0]]=0;
 for(let i=0;i<q.length;i++){
  const p=q[i],x=p%T,y=(p/T)|0;
  for(const [dx,dy] of D4){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=T||ny>=T)continue;const k=ny*T+nx;if(GR[k]===0&&d[k]<0){d[k]=d[p]+1;q.push(k)}}
 }
 return d;
}
const wall=(x,y)=>x<0||y<0||x>=T||y>=T||GR[y*T+x]===1;
function buildMap(){
 MAPC=document.createElement('canvas');MAPC.width=MAPC.height=T*TS;const m=MAPC.getContext('2d');
 for(let y=0;y<T;y++)for(let x=0;x<T;x++){
  const px=x*TS,py=y*TS;
  if(GR[y*T+x]===0){
   const v=R()*14|0;m.fillStyle='rgb('+(198+v)+','+(168+v)+','+(112+v)+')';m.fillRect(px,py,TS,TS);
   m.strokeStyle='rgba(90,64,30,.18)';m.lineWidth=1;m.strokeRect(px+.5,py+.5,TS-1,TS-1);
   for(let i=0;i<5;i++){m.fillStyle=R()<.5?'rgba(90,64,30,.2)':'rgba(255,240,200,.2)';m.fillRect(px+R()*TS,py+R()*TS,2,2)}
   if(R()<.12){m.strokeStyle='rgba(70,48,20,.35)';m.beginPath();m.moveTo(px+R()*TS,py+R()*TS);m.lineTo(px+R()*TS,py+R()*TS);m.stroke()}
   if(wall(x,y-1)){const q=m.createLinearGradient(0,py,0,py+12);q.addColorStop(0,'rgba(0,0,0,.4)');q.addColorStop(1,'rgba(0,0,0,0)');m.fillStyle=q;m.fillRect(px,py,TS,12)}
   if(wall(x-1,y)){const q=m.createLinearGradient(px,0,px+12,0);q.addColorStop(0,'rgba(0,0,0,.35)');q.addColorStop(1,'rgba(0,0,0,0)');m.fillStyle=q;m.fillRect(px,py,12,TS)}
  }else{
   m.fillStyle='#a8834a';m.fillRect(px,py,TS,TS);
   m.fillStyle='rgba(0,0,0,.18)';m.fillRect(px,py+TS/2-1,TS,2);
   const o=(x+y)%2;m.fillRect(px+(o?TS*.3:TS*.7),py,2,TS/2);m.fillRect(px+(o?TS*.7:TS*.3),py+TS/2,2,TS/2);
   m.fillStyle='rgba(255,235,190,.28)';m.fillRect(px,py,TS,2);m.fillRect(px,py,2,TS);
   m.fillStyle='rgba(0,0,0,.3)';m.fillRect(px,py+TS-2,TS,2);m.fillRect(px+TS-2,py,2,TS);
   if(!(wall(x+1,y)&&wall(x-1,y)&&wall(x,y+1)&&wall(x,y-1))&&R()<.4)glyph(m,px+TS/2,py+TS/2);
  }
 }
}
function glyph(m,cx,cy){
 m.strokeStyle='rgba(60,38,14,.6)';m.fillStyle='rgba(60,38,14,.6)';m.lineWidth=2;
 const t=R()*4|0;m.beginPath();
 if(t===0){m.ellipse(cx,cy,11,5,0,0,7);m.stroke();m.beginPath();m.arc(cx,cy,2.5,0,7);m.fill();m.beginPath();m.moveTo(cx-4,cy+6);m.lineTo(cx-8,cy+13);m.stroke()}
 else if(t===1){m.arc(cx,cy-6,4.5,0,7);m.stroke();m.beginPath();m.moveTo(cx,cy-1.5);m.lineTo(cx,cy+11);m.moveTo(cx-7,cy+3);m.lineTo(cx+7,cy+3);m.stroke()}
 else if(t===2){for(let i=-1;i<=1;i++){m.moveTo(cx-10,cy+i*7);for(let k=1;k<=5;k++)m.lineTo(cx-10+k*4,cy+i*7+(k%2?-3:3))}m.stroke()}
 else{m.ellipse(cx,cy,6,8,0,0,7);m.moveTo(cx,cy-8);m.lineTo(cx,cy+8);m.moveTo(cx-6,cy-3);m.lineTo(cx-11,cy-6);m.moveTo(cx+6,cy-3);m.lineTo(cx+11,cy-6);m.moveTo(cx-6,cy+3);m.lineTo(cx-11,cy+7);m.moveTo(cx+6,cy+3);m.lineTo(cx+11,cy+7);m.stroke()}
}
function buildLevel(){
 const n=8+2*(G.level-1);genMaze(n);buildMap();
 EXP=new Uint8Array(T*T);P.x=1.5*TS;P.y=1.5*TS;P.tx=1;P.ty=1;P.ang=0;
 const d0=bfs(1,1);
 let cells=[],maxD=0,ex=1,ey=1;
 for(let cy=0;cy<n;cy++)for(let cx=0;cx<n;cx++){const x=2*cx+1,y=2*cy+1,dd=d0[y*T+x];if(dd>maxD){maxD=dd;ex=x;ey=y}cells.push([x,y,dd])}
 EX=ex;EY=ey;
 cells=cells.filter(c=>!(c[0]===1&&c[1]===1)&&!(c[0]===EX&&c[1]===EY)).sort(()=>R()-.5);
 const take=f=>{const i=cells.findIndex(f);return i<0?(cells.length?cells.pop():null):cells.splice(i,1)[0]};
 const ctr=c=>({x:(c[0]+.5)*TS,y:(c[1]+.5)*TS});
 G.need=Math.min(5,2+Math.floor(G.level/2));G.got=0;G.fuel=100;
 ANK=[];GEM=[];OIL=[];SPK=[];ENE=[];ITM=[];PRJ=[];CHE=[];FX=[];TOR=[];
 const used=new Set();
 for(let i=0;i<G.need;i++){const c=take(c=>c[2]>maxD*.3);if(c){ANK.push(ctr(c));used.add(c[0]+','+c[1])}}
 for(let i=0;i<4+G.level;i++){const c=take(()=>true);if(c){GEM.push(ctr(c));used.add(c[0]+','+c[1])}}
 for(let i=0;i<2+Math.floor(G.level/2);i++){const c=take(c=>deadEnd(c[0],c[1]));if(c){CHE.push({...ctr(c),open:0});used.add(c[0]+','+c[1])}}
 for(let i=0;i<2+Math.floor(G.level/2);i++){const c=take(()=>true);if(c){OIL.push(ctr(c));used.add(c[0]+','+c[1])}}
 const nm=Math.min(5,1+Math.floor((G.level-1)/2)+(G.level>3?1:0));
 for(let i=0;i<nm;i++){const c=take(c=>c[2]>maxD*.35&&c[2]>8);if(c){const o=ctr(c);ENE.push(mkEnemy('mummy',o.x,o.y,c[0],c[1],false))}}
 for(let i=0;i<1+Math.floor(G.level/2);i++){const c=take(c=>c[2]>maxD*.25&&c[2]>6);if(c){const o=ctr(c);ENE.push(mkEnemy('scorp',o.x,o.y,c[0],c[1],false))}}
 for(let i=0,k=0;i<2+2*G.level&&k<500;k++){
  const x=1+(R()*(T-2)|0),y=1+(R()*(T-2)|0);
  if(GR[y*T+x]===0&&d0[y*T+x]>6&&!used.has(x+','+y)){used.add(x+','+y);SPK.push({x,y,ph:R()*2.6});i++}
 }
 for(let i=0,k=0;i<n+2&&k<600;k++){
  const x=1+(R()*(T-2)|0),y=1+(R()*(T-2)|0);if(GR[y*T+x]!==1)continue;
  const dr=D4.find(([dx,dy])=>!wall(x+dx,y+dy));if(!dr)continue;
  TOR.push({x:(x+.5+dr[0]*.5)*TS,y:(y+.5+dr[1]*.5)*TS,wx:(x+.5)*TS,wy:(y+.5)*TS,ph:R()*6});i++;
 }
 PD=bfs(1,1);
 msgTxt='Mərhələ '+G.level;msgT=2.4;G.spawnT=9;swing=null;
}
function newGame(){G=freshG();state='play';keys={};buildLevel()}
/* ---- məntiq ---- */
const solid=(x,y)=>wall(Math.floor(x/TS),Math.floor(y/TS));
const box=(x,y,r)=>solid(x-r,y-r)||solid(x+r,y-r)||solid(x-r,y+r)||solid(x+r,y+r);
function tryMove(o,dx,dy,r){if(!box(o.x+dx,o.y,r))o.x+=dx;if(!box(o.x,o.y+dy,r))o.y+=dy}
function lightR(){return(80+110*(G.fuel/100))*(1+.03*Math.sin(G.t*13)+.02*Math.sin(G.t*7.3))}
function hurt(){
 if(G.inv>0)return;
 shake=8;flash=.4;
 if(G.armor>0){G.armor--;G.inv=1.2;snd('shield');return}
 G.lives--;G.inv=2.2;snd('hurt');
 if(G.lives<=0){state='over';snd('over');if(G.score>best){best=G.score;try{sessionStorage.setItem('ebest',best)}catch(e){}}}
}
function freshG(){return{level:1,score:0,gold:0,lives:3,maxL:6,armor:0,need:2,got:0,fuel:100,inv:0,t:0,wp:{sword:1,bow:0,staff:0,eye:0},ammo:{bow:0,staff:0,eye:0},cw:'sword',cd:0,dm:1,spd:1,spawnT:9}}
const WORD=['sword','bow','staff','eye'];
const WP={sword:{n:'Xopeş',cd:.35},bow:{n:'Yay',cd:.45,st:15,am:8},staff:{n:'Alov əsası',cd:.6,st:10,am:5},eye:{n:'Ra gözü',cd:.9,st:8,am:4}};
const EK={scorp:{hp:2,sp:95,wsp:55,r:10,g:[6,12]},mummy:{hp:4,sp:75,wsp:50,r:12,g:[15,25]},ghost:{hp:3,sp:48,wsp:48,r:11,g:[20,30]},anubis:{hp:8,sp:70,wsp:45,r:13,g:[40,60]}};
function mkEnemy(k,x,y,tx,ty,hunter){const hp=EK[k].hp+Math.floor((G.level-1)/2);return{k,x,y,tx,ty,nx:tx,ny:ty,px:tx,py:ty,ang:0,stun:0,chase:false,hunter,hp,max:hp,cd:2,fl:0,ph:R()*6}}
function deadEnd(x,y){let n=0;for(const [dx,dy] of D4)if(!wall(x+dx,y+dy))n++;return n===1}
function msg(t,d){msgTxt=t;msgT=d||1.6}
function fxB(x,y,n,col,sp){for(let i=0;i<n;i++){const a=R()*6.28,s=(sp||90)*(.3+R());FX.push({t:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+R()*.4,m:1,c:col,r:1.5+R()*2})}}
function fxT(x,y,s,col){FX.push({t:'t',x,y,vx:0,vy:-28,l:1.1,m:1,s,c:col})}
function los(x0,y0,x1,y1){const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/8);for(let i=1;i<n;i++){if(solid(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n))return false}return true}
function collect(arr,r,fn){for(let i=arr.length-1;i>=0;i--)if(Math.hypot(arr[i].x-P.x,arr[i].y-P.y)<r){arr.splice(i,1);fn()}}
function pickNext(m,chase){
 const nb=D4.map(([dx,dy])=>[m.tx+dx,m.ty+dy]).filter(([x,y])=>!wall(x,y));
 if(!nb.length)return;
 let c;
 if(chase){c=nb.reduce((a,b)=>PD[b[1]*T+b[0]]<PD[a[1]*T+a[0]]?b:a)}
 else{const f=nb.filter(([x,y])=>!(x===m.px&&y===m.py)),l=f.length?f:nb;c=l[R()*l.length|0]}
 m.px=m.tx;m.py=m.ty;m.nx=c[0];m.ny=c[1];
}
function ambush(){
 if(ENE.length>=Math.min(8,3+G.level))return;
 const Rl=lightR();let c=[];
 for(let y=0;y<T;y++)for(let x=0;x<T;x++){const d=PD[y*T+x];if(d>=8&&d<=14&&Math.hypot((x+.5)*TS-P.x,(y+.5)*TS-P.y)>Rl+30)c.push([x,y])}
 if(!c.length)for(let y=0;y<T;y++)for(let x=0;x<T;x++){const d=PD[y*T+x];if(d>=6&&d<=18)c.push([x,y])}
 if(!c.length)return;
 const [x,y]=c[R()*c.length|0],pool=['scorp','scorp','mummy'];
 if(G.level>=2)pool.push('ghost');if(G.level>=3)pool.push('anubis','ghost');
 const k=pool[R()*pool.length|0];
 ENE.push(mkEnemy(k,(x+.5)*TS,(y+.5)*TS,x,y,true));
 snd(k==='scorp'?'hiss':'groan');shake=Math.max(shake,3);
 if(R()<.4)msg('Qaranlıqda nəsə tərpəndi…',1.5);
}
function nextWeapon(){
 let i=WORD.indexOf(G.cw);
 for(let k=1;k<=4;k++){const w=WORD[(i+k)%4];if(G.wp[w]&&(w==='sword'||G.ammo[w]>0)){G.cw=w;snd('sw');return}}
}
function aimTarget(){
 let best=null,bd=220;
 for(const m of ENE){const d=Math.hypot(m.x-P.x,m.y-P.y);if(d>=bd)continue;const a=Math.atan2(m.y-P.y,m.x-P.x),da=Math.abs(Math.atan2(Math.sin(a-P.ang),Math.cos(a-P.ang)));if(da<.9&&los(P.x,P.y,m.x,m.y)){best=m;bd=d}}
 return best;
}
function dmgE(m,d,ang){
 m.hp-=d;m.fl=.12;m.stun=Math.max(m.stun,.2);
 if(ang!==undefined&&m.k!=='ghost')tryMove(m,Math.cos(ang)*14,Math.sin(ang)*14,8);
 fxB(m.x,m.y,5,m.k==='ghost'?'#9fd8ff':'#c0392b',70);snd('hit');
 if(m.hp<=0)killEnemy(m);
}
function pickW(){const r=R();return r<.45?'bow':r<.75?'staff':'eye'}
function killEnemy(m){
 const i=ENE.indexOf(m);if(i<0)return;ENE.splice(i,1);
 const E=EK[m.k];fxB(m.x,m.y,16,m.k==='ghost'?'#bfe6ff':'#d8a830',130);snd('kill');
 const v=E.g[0]+(R()*(E.g[1]-E.g[0])|0),sp=solid(m.x,m.y)?[P.x,P.y]:[m.x,m.y];
 ITM.push({x:sp[0],y:sp[1],t:'coin',v});
 let r=R();if(m.k==='anubis')r=Math.min(r,.2);
 const at=(dx,dy)=>({x:sp[0]+dx,y:sp[1]+dy});
 if(r<.28)ITM.push({...at(10,6),t:pickW()});
 else if(r<.36&&G.lives<G.maxL)ITM.push({...at(-10,6),t:'heart'});

function enemyUpdate(m,dt){
 const E=EK[m.k];m.fl=Math.max(0,m.fl-dt);m.cd-=dt;
 if(m.stun>0){m.stun-=dt;return}
 const dx=P.x-m.x,dy=P.y-m.y,dist=Math.hypot(dx,dy)||1;
 if(m.k==='ghost'){
  const sp=(48+4*G.level)*dt;m.x+=dx/dist*sp;m.y+=dy/dist*sp;m.ang=Math.atan2(dy,dx);m.tx=Math.floor(m.x/TS);m.ty=Math.floor(m.y/TS);
 }else{
  const pd=PD[m.ty*T+m.tx],chase=m.hunter?(pd>=0&&pd<=16):(pd>=0&&pd<=7);
  if(chase&&!m.chase)snd(m.k==='scorp'?'hiss':'groan');
  m.chase=chase;
  const sp=(chase?Math.min(130,E.sp+6*G.level):E.wsp)*dt,tx=(m.nx+.5)*TS,ty=(m.ny+.5)*TS,ddx=tx-m.x,ddy=ty-m.y,dd=Math.hypot(ddx,ddy);
  if(dd<=sp){m.x=tx;m.y=ty;m.tx=m.nx;m.ty=m.ny;pickNext(m,chase)}
  else{m.x+=ddx/dd*sp;m.y+=ddy/dd*sp;m.ang=Math.atan2(ddy,ddx)}
 }
 if(m.k==='anubis'&&m.cd<=0&&dist<280&&los(m.x,m.y,P.x,P.y)){
  PRJ.push({x:m.x,y:m.y,vx:dx/dist*170,vy:dy/dist*170,dmg:1,life:2.5,kind:'orb',own:'e'});m.cd=2.6;snd('efire');
 }
 if(dist<E.r+11){hurt();m.stun=1;tryMove(m,-dx/dist*18,-dy/dist*18,8)}
}

 if(state!=='play')return;
 G.t+=dt;G.inv=Math.max(0,G.inv-dt);G.cd-=dt;flash=Math.max(0,flash-dt);msgT=Math.max(0,msgT-dt);
 if(swing){swing.t-=dt;if(swing.t<=0)swing=null}
 let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);

 G.fuel=Math.max(0,G.fuel-.8*dt);
 const ptx=Math.floor(P.x/TS),pty=Math.floor(P.y/TS);
 if(ptx!==P.tx||pty!==P.ty){P.tx=ptx;P.ty=pty;PD=bfs(ptx,pty)}
 const Rl=lightR();
 for(let y=Math.max(0,pty-5);y<=Math.min(T-1,pty+5);y++)for(let x=Math.max(0,ptx-5);x<=Math.min(T-1,ptx+5);x++)
  if(Math.hypot((x+.5)*TS-P.x,(y+.5)*TS-P.y)<Rl*.8)EXP[y*T+x]=1;
 collect(ANK,22,()=>{G.got++;G.score+=100;snd('ankh');if(G.got>=G.need){msg('Qapı açıldı! Çıxışa get',2.5);snd('open')}else msg('Ankh: '+G.got+'/'+G.need,1.2)});
 collect(GEM,20,()=>{G.score+=50;G.gold+=50;snd('gem')});
 collect(OIL,20,()=>{G.fuel=Math.min(100,G.fuel+40);snd('oil');msg('Məşəl yağı',1)});
 for(const s of SPK){const t=(G.t+s.ph)%2.6;if(t>.15&&t<1&&s.x===ptx&&s.y===pty)hurt()}
 if(keys[' ']&&G.cd<=0)attack();
 G.spawnT-=dt;if(G.spawnT<=0){ambush();G.spawnT=Math.max(5,13-G.level)+R()*5}
 for(const m of ENE.slice())enemyUpdate(m,dt);
 for(const p of PRJ){
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
  if(solid(p.x,p.y)||p.life<=0){p.dead=1;if(p.kind==='fire')fxB(p.x,p.y,10,'#ff9a30',110)}
  else if(p.own==='p'){
   for(const m of ENE){
    if(m.k==='ghost'&&p.kind==='arrow')continue;
    if(Math.hypot(m.x-p.x,m.y-p.y)<EK[m.k].r+5){
     p.dead=1;dmgE(m,p.dmg*G.dm,Math.atan2(p.vy,p.vx));
     if(p.kind==='fire'){fxB(p.x,p.y,18,'#ff9a30',140);for(const o of ENE.slice())if(o!==m&&Math.hypot(o.x-p.x,o.y-p.y)<44)dmgE(o,2*G.dm)}
     break;
    }
   }
  }else if(Math.hypot(p.x-P.x,p.y-P.y)<14){hurt();p.dead=1}
 }
 PRJ=PRJ.filter(p=>!p.dead);
 for(let i=ITM.length-1;i>=0;i--){
  const it=ITM[i],d=Math.hypot(it.x-P.x,it.y-P.y);
  if(it.t==='coin'&&d<80&&d>1){it.x+=(P.x-it.x)/d*230*dt;it.y+=(P.y-it.y)/d*230*dt}
  if(d<16){ITM.splice(i,1);if(it.t==='coin'&&!it.v){it.v=5+(R()*10|0)}collectItem(it)}
 }
 for(const c of CHE)if(!c.open&&Math.hypot(c.x-P.x,c.y-P.y)<24)openChest(c);
 for(const f of FX){f.x+=f.vx*dt;f.y+=f.vy*dt;f.m-=dt/f.l}
 FX=FX.filter(f=>f.m>0);
 if(state==='play'&&ptx===EX&&pty===EY){
  if(G.got>=G.need){
   G.score+=200+Math.round(G.fuel*2);
   if(G.level>=7){state='win';snd('win');if(G.score>best){best=G.score;try{sessionStorage.setItem('ebest',best)}catch(e){}}}
   else{G.level++;G.lives=Math.min(G.maxL,G.lives+1);snd('door');buildLevel()}
  }else if(msgT<=0){msg('Qapı bağlıdır: ankhlar çatmır',1.5);snd('locked')}
 }
}

 if(m.k==='mummy')drawMummy(m);else if(m.k==='scorp')drawScorp(m);else if(m.k==='ghost')drawGhost(m);else drawAnubis(m);
 g.filter='none';
 if(m.hp<m.max){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(m.x-12,m.y-E.r-12,24,4);g.fillStyle='#e5484d';g.fillRect(m.x-12,m.y-E.r-12,24*Math.max(0,m.hp)/m.max,4)}
}
function drawProj(){
 for(const p of PRJ){
  const a=Math.atan2(p.vy,p.vx);
  g.save();g.translate(p.x,p.y);g.rotate(a);
  if(p.kind==='arrow'){g.strokeStyle='#e8dcc0';g.lineWidth=2;g.beginPath();g.moveTo(-12,0);g.lineTo(6,0);g.stroke();g.fillStyle='#bfc5cc';g.beginPath();g.moveTo(10,0);g.lineTo(4,-3);g.lineTo(4,3);g.fill();g.strokeStyle='#c0392b';g.beginPath();g.moveTo(-12,0);g.lineTo(-15,-3);g.moveTo(-12,0);g.lineTo(-15,3);g.stroke()}
  else{
   g.globalCompositeOperation='lighter';
   const c=p.kind==='fire'?['255,170,60','255,90,20',9]:p.kind==='eye'?['255,235,140','255,190,40',6]:['200,110,255','120,40,200',8];
   const q=g.createRadialGradient(0,0,0,0,0,c[2]*1.8);q.addColorStop(0,'rgba('+c[0]+',.95)');q.addColorStop(.5,'rgba('+c[1]+',.5)');q.addColorStop(1,'rgba('+c[1]+',0)');g.fillStyle=q;g.fillRect(-c[2]*2,-c[2]*2,c[2]*4,c[2]*4);
  }
  g.restore();
 }
 g.globalCompositeOperation='source-over';
}
function drawFX(){
 for(const f of FX){
  if(f.t==='p'){g.globalAlpha=Math.max(0,f.m);g.fillStyle=f.c;g.beginPath();g.arc(f.x,f.y,f.r,0,7);g.fill();g.globalAlpha=1}
  else{g.globalAlpha=Math.max(0,Math.min(1,f.m*1.5));txt(f.s,f.x,f.y,15,'center',f.c,700);g.globalAlpha=1}
 }
}
function drawSwing(){
 if(!swing)return;
 const p=1-swing.t/.2,a0=-1.1,a1=a0+2.2*p;
 g.save();g.translate(P.x,P.y);g.rotate(swing.ang);
 g.strokeStyle='rgba(255,245,210,'+(swing.t/.2*.9)+')';g.lineWidth=6;g.lineCap='round';g.beginPath();g.arc(0,0,36,a0,a1);g.stroke();
 g.strokeStyle='#e8eef5';g.lineWidth=3;g.beginPath();g.moveTo(Math.cos(a1)*14,Math.sin(a1)*14);g.lineTo(Math.cos(a1)*42,Math.sin(a1)*42);g.stroke();
 g.restore();
}
function drawEyes(cx,cy){
 const Rl=lightR();
 g.globalCompositeOperation='lighter';
 for(const m of ENE){
  const d=Math.hypot(m.x-P.x,m.y-P.y);
  if(isLit(m,Rl)||d>340)continue;
  const ex=m.x-cx,ey=m.y-cy,bl=.5+.5*Math.sin(G.t*5+m.ph),al=(1-d/340*.5)*(.4+.6*bl),ox=-Math.sin(m.ang)*3.5,oy=Math.cos(m.ang)*3.5;
  const col=m.k==='ghost'?'150,210,255':m.k==='anubis'?'255,210,60':'255,50,40';
  for(const s of [-1,1]){
   const q=g.createRadialGradient(ex+ox*s,ey+oy*s,0,ex+ox*s,ey+oy*s,9);q.addColorStop(0,'rgba('+col+','+al+')');q.addColorStop(1,'rgba('+col+',0)');g.fillStyle=q;g.fillRect(ex+ox*s-9,ey+oy*s-9,18,18);
  }
 }
 g.globalCompositeOperation='source-over';
}
function drawWorld(cx,cy){
 g.save();g.translate(-cx,-cy);
 g.drawImage(MAPC,0,0);
 for(const t of TOR){
  g.fillStyle='#3b2a14';g.fillRect(t.wx-3,t.wy-3,6,6);
  flame(t.x*.5+t.wx*.5,t.y*.5+t.wy*.5,6,G.t+t.ph);
 }
 for(const s of SPK){
  const px=s.x*TS,py=s.y*TS,t=(G.t+s.ph)%2.6,up=t>.15&&t<1,h=up?1:(t>2.2?(t-2.2)/.4*.5:0);
  g.fillStyle='#8a7248';g.fillRect(px+5,py+5,TS-10,TS-10);g.fillStyle='#2c2112';
  for(const [ox,oy] of [[12,12],[28,12],[12,28],[28,28]]){
   if(h>0){g.fillStyle='#cfd3d8';g.beginPath();g.moveTo(px+ox-4,py+oy+4);g.lineTo(px+ox,py+oy+4-12*h);g.lineTo(px+ox+4,py+oy+4);g.fill()}
   else{g.beginPath();g.arc(px+ox,py+oy,2.5,0,7);g.fill()}
  }
 }
 const ex=EX*TS,ey=EY*TS,open=G.got>=G.need;
 g.fillStyle=open?'#2a1d0a':'#1c1812';g.fillRect(ex+3,ey+3,TS-6,TS-6);
 g.strokeStyle=open?'#ffd24a':'#7a6a48';g.lineWidth=3;g.strokeRect(ex+4,ey+4,TS-8,TS-8);
 if(open){g.globalCompositeOperation='lighter';const q=g.createRadialGradient(ex+20,ey+20,0,ex+20,ey+20,40);q.addColorStop(0,'rgba(255,220,120,.9)');q.addColorStop(1,'rgba(255,170,40,0)');g.fillStyle=q;g.fillRect(ex-30,ey-30,100,100);g.globalCompositeOperation='source-over';
  g.strokeStyle='rgba(255,230,160,.9)';g.lineWidth=2;for(let i=0;i<4;i++){g.beginPath();g.moveTo(ex+8,ey+9+i*7);g.lineTo(ex+32,ey+9+i*7);g.stroke()}}
 else ankhIcon(ex+20,ey+19,20,'#7a6a48',3);
 const pu=.6+.4*Math.sin(G.t*4);
 for(const a of ANK){g.globalCompositeOperation='lighter';const q=g.createRadialGradient(a.x,a.y,0,a.x,a.y,26);q.addColorStop(0,'rgba(255,210,80,'+.5*pu+')');q.addColorStop(1,'rgba(255,170,40,0)');g.fillStyle=q;g.fillRect(a.x-26,a.y-26,52,52);g.globalCompositeOperation='source-over';ankhIcon(a.x,a.y,22,'#ffd24a',4)}
 for(const e of GEM){g.fillStyle='#17b3a6';g.beginPath();g.ellipse(e.x,e.y,7,9,0,0,7);g.fill();g.strokeStyle='#0b6e66';g.lineWidth=1.5;g.beginPath();g.moveTo(e.x,e.y-9);g.lineTo(e.x,e.y+9);g.moveTo(e.x-7,e.y-2);g.lineTo(e.x-12,e.y-6);g.moveTo(e.x+7,e.y-2);g.lineTo(e.x+12,e.y-6);g.stroke();g.fillStyle='rgba(255,255,255,'+(.4+.4*pu)+')';g.fillRect(e.x-3,e.y-5,2,4)}
 for(const o of OIL){g.fillStyle='#8a4a22';g.beginPath();g.ellipse(o.x,o.y+2,8,9,0,0,7);g.fill();g.fillRect(o.x-3,o.y-10,6,5);g.fillStyle='#e0a050';g.beginPath();g.ellipse(o.x-2,o.y,2.5,4,0,0,7);g.fill()}
 const Rl=lightR();
 for(const c of CHE)drawChest(c);
 for(const it of ITM)drawItem(it);
 for(const m of ENE)if(isLit(m,Rl))drawEnemy(m);
 drawPlayer();drawSwing();drawProj();drawFX();
 g.restore();
}
function drawDark(cx,cy){
 const Rl=lightR();
 dg.globalCompositeOperation='source-over';dg.clearRect(0,0,VW,VH);
 dg.fillStyle='rgba(4,3,8,.96)';dg.fillRect(0,0,VW,VH);
 dg.globalCompositeOperation='destination-out';
 dg.fillStyle='rgba(0,0,0,.5)';
 const x0=Math.max(0,Math.floor(cx/TS)),y0=Math.max(0,Math.floor(cy/TS)),x1=Math.min(T-1,Math.floor((cx+VW)/TS)),y1=Math.min(T-1,Math.floor((cy+VH)/TS));
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(EXP[y*T+x])dg.fillRect(x*TS-cx,y*TS-cy,TS,TS);
 const lamp=(x,y,r,a)=>{const q=dg.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,'rgba(0,0,0,'+a+')');q.addColorStop(.55,'rgba(0,0,0,'+a*.8+')');q.addColorStop(1,'rgba(0,0,0,0)');dg.fillStyle=q;dg.fillRect(x-r,y-r,r*2,r*2)};
 lamp(P.x-cx,P.y-cy,Rl,1);
 for(const t of TOR){const x=t.x-cx,y=t.y-cy;if(x>-130&&y>-130&&x<VW+130&&y<VH+130)lamp(x,y,105*(1+.05*Math.sin(G.t*11+t.ph)),.85)}
 g.drawImage(DK,0,0);
 g.globalCompositeOperation='lighter';
 const q=g.createRadialGradient(P.x-cx,P.y-cy,0,P.x-cx,P.y-cy,Rl);q.addColorStop(0,'rgba(255,160,60,.2)');q.addColorStop(1,'rgba(255,120,30,0)');g.fillStyle=q;g.fillRect(0,0,VW,VH);
 g.globalCompositeOperation='source-over';
}
function drawHUD(){
 panel(8,8,236,90);
 for(let i=0;i<G.lives;i++)txt('♥',16+i*21,34,22,'left','#e5484d',700);
 for(let i=0;i<G.armor;i++)txt('◆',146+i*18,32,18,'left','#6fc3ff',700);
 for(let i=0;i<G.need;i++)ankhIcon(24+i*24,58,16,i<G.got?'#ffd24a':'rgba(255,210,74,.28)',3);
 txt('Qızıl '+G.gold,16,88,14,'left','#ffd24a',700);
 txt('Hesab '+G.score,236,58,15,'right','#f2e6c6',700);
 txt('Rekord '+best,236,78,12,'right','rgba(242,230,198,.7)',500);
 txt('Mərhələ '+G.level+'/7',VW/2,26,15,'center','#f2e6c6',700);
 let sx=8;
 WORD.forEach((w,i)=>{
  if(!G.wp[w])return;
  const sel=G.cw===w;
  panel(sx,VH-58,50,46);
  if(sel){g.strokeStyle='#ffd24a';g.lineWidth=2;g.beginPath();g.roundRect(sx,VH-58,50,46,8);g.stroke()}
  wIcon(w,sx+25,VH-38,22,sel?'#fff3c0':'rgba(242,230,198,.6)');
  txt(String(i+1),sx+5,VH-45,11,'left','rgba(242,230,198,.6)',600);
  txt(w==='sword'?'∞':String(G.ammo[w]),sx+25,VH-17,12,'center',w!=='sword'&&G.ammo[w]<=0?'#e5484d':'#f2e6c6',700);
  sx+=54;
 });
 panel(VW/2-80,VH-30,160,16);
 g.fillStyle='rgba(0,0,0,.5)';g.fillRect(VW/2-74,VH-25,148,6);
 g.fillStyle=G.fuel>25?'#ffb347':'#e5484d';g.fillRect(VW/2-74,VH-25,148*G.fuel/100,6);
 const s=Math.min(4,118/T),mx=VW-130,my=10;
 panel(mx-4,my-2,126,126);
 for(let y=0;y<T;y++)for(let x=0;x<T;x++)if(EXP[y*T+x]){g.fillStyle=GR[y*T+x]?'#5a4326':'#c9a96a';g.fillRect(mx+x*s,my+y*s,s,s)}
 if(EXP[EY*T+EX]){g.fillStyle=G.got>=G.need?'#ffd24a':'#7a6a48';g.fillRect(mx+EX*s-1,my+EY*s-1,s+2,s+2)}
 g.fillStyle=Math.floor(G.t*3)%2?'#fff':'#e5484d';g.fillRect(mx+P.tx*s-1,my+P.ty*s-1,s+2,s+2);
 if(msgT>0)txt(msgTxt,VW/2,118,20,'center','#ffd24a',700);
}
function draw(){
 g.fillStyle='#000';g.fillRect(0,0,VW,VH);
 if(!MAPC){drawMenuBg();return}
 const mw=T*TS;
 const cx=mw<=VW?(mw-VW)/2:Math.max(0,Math.min(mw-VW,P.x-VW/2)),cy=mw<=VH?(mw-VH)/2:Math.max(0,Math.min(mw-VH,P.y-VH/2));
 g.save();
 if(shake>0){g.translate((R()-.5)*shake,(R()-.5)*shake);shake=Math.max(0,shake-.5)}
 drawWorld(cx,cy);drawDark(cx,cy);drawEyes(cx,cy);
 g.restore();
 if(flash>0){g.fillStyle='rgba(200,20,20,'+flash*.8+')';g.fillRect(0,0,VW,VH)}
 drawHUD();
 if(state!=='play')overlay();
}
function drawMenuBg(){
 const q=g.createLinearGradient(0,0,0,VH);q.addColorStop(0,'#1b1308');q.addColorStop(1,'#4a3418');g.fillStyle=q;g.fillRect(0,0,VW,VH);
 g.fillStyle='#8a6a34';g.beginPath();g.moveTo(320,170);g.lineTo(560,470);g.lineTo(80,470);g.fill();
 g.fillStyle='#6b5028';g.beginPath();g.moveTo(320,170);g.lineTo(560,470);g.lineTo(380,470);g.fill();
 flame(320,470,14,G.t);G.t+=.016;
 overlay();
}
function overlay(){
 g.fillStyle='rgba(8,6,3,.7)';g.fillRect(0,0,VW,VH);
 const cx=VW/2;
 if(state==='menu'){
  txt('EHRAMIN SİRLƏRİ',cx,190,44,'center','#ffd24a',800);
  txt('Qədim ehramın qaranlıq labirintindən çıx.',cx,236,17,'center','#f2e6c6',500);
  txt('Ankhları tap, qapını aç, çıxışa çat.',cx,262,17,'center','#f2e6c6',500);
  txt('Mumiyalardan və tikanlardan qaç.',cx,288,17,'center','#f2e6c6',500);
  txt('Məşəlin yağı azalır: küpələri topla.',cx,314,17,'center','#f2e6c6',500);
  txt('Boşluq: hücum. Düşmənləri öldür, qızıl və silah qazan.',cx,350,17,'center','#ffd27a',600);
  txt('Xəzinə sandıqlarında silah, can və bonuslar var.',cx,376,17,'center','#ffd27a',600);
 }else if(state==='over'){
  txt('Ehram səni uddu',cx,260,42,'center','#e5484d',800);
  txt('Hesab: '+G.score+'   Mərhələ: '+G.level,cx,306,20,'center','#f2e6c6',600);
 }else if(state==='win'){
  txt('Fironun xəzinəsinə çatdın!',cx,250,36,'center','#ffd24a',800);
  txt('Bütün 7 mərhələni keçdin. Hesab: '+G.score,cx,298,20,'center','#f2e6c6',600);
 }else txt('Fasilə',cx,300,40,'center','#ffd24a',800);
 txt(state==='pause'?'P və ya toxun: davam et':state==='menu'?'Başlamaq üçün Enter, boşluq və ya toxun':'Yenidən oynamaq üçün Enter və ya toxun',cx,420,17,'center','#ffd27a',600);
}
function loop(ts){
 const d=Math.min(.05,(ts-last)/1000||0);last=ts;
 update(d);draw();requestAnimationFrame(loop);
}
function begin(){initAudio();newGame()}
function togglePause(){if(state==='play')state='pause';else if(state==='pause'){state='play';keys={}}}
addEventListener('keydown',e=>{
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();
 if(k==='m'){toggleMute();return}
 if(state==='menu'||state==='over'||state==='win'){if((k===' '||k==='Enter')&&!e.repeat)begin();return}
 if(k==='p'||k==='Escape'){if(!e.repeat)togglePause();return}
 if(k==='q'||k==='e'){if(!e.repeat)nextWeapon();return}
 if(['1','2','3','4'].includes(k)){const w=WORD[+k-1];if(G.wp[w]&&(w==='sword'||G.ammo[w]>0)){G.cw=w;snd('sw')}return}
 keys[k]=true;
});
addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
addEventListener('blur',()=>{keys={};if(state==='play')state='pause'});
cv.addEventListener('pointerdown',()=>{if(state==='menu'||state==='over'||state==='win')begin();else if(state==='pause')togglePause()});
document.querySelectorAll('#pad button').forEach(b=>{
 const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='menu'||state==='over'||state==='win'){begin();return}if(state==='pause'){togglePause();return}if(k)keys[k]=true;else nextWeapon()});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{keys[k]=false}));
});
document.getElementById('mt').addEventListener('click',e=>{toggleMute();e.currentTarget.blur()});
requestAnimationFrame(loop);
</script>
